name: Docs related links

on:
  push:
    branches: [main]
    paths:
      - "docs/**/*.md"
      - "scripts/docs-related.ts"
  pull_request:
    paths:
      - "docs/**/*.md"
      - "scripts/docs-related.ts"
  workflow_dispatch:

jobs:
  related:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify Related sections match Glyph rankings
        run: npm run docs:related:check
